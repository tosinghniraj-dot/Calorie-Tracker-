<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Tracker</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#5fb878; --accent2:#e8a33d;
    --text:#e8e8ea; --muted:#8b8f99; --danger:#e05c5c; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px;
  }
  .app{max-width:480px; margin:0 auto; padding:16px;}
  h1{font-size:20px; font-weight:700; margin:8px 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .totals{display:flex; justify-content:space-between; gap:8px;}
  .totals .stat{text-align:center; flex:1;}
  .totals .stat .v{font-size:20px; font-weight:700;}
  .totals .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .stat.cal .v{color:var(--accent2);}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; margin-top:12px;}
  input[type=text],input[type=search],input[type=number]{
    width:100%; background:#11131a; border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:14px; font-family:inherit;
    -moz-appearance:textfield; outline:none;
  }
  input[type=text]:focus,input[type=search]:focus,input[type=number]:focus{border-color:var(--accent);}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
  input[type=search]::-webkit-search-cancel-button{display:none;}
  button{
    background:var(--accent); color:#0f1115; border:none; border-radius:10px;
    padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; width:100%; margin-top:14px;
  }
  button:active{opacity:.85;}
  button.secondary{background:#2a2e38; color:var(--text); font-weight:600;}
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tab{
    flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; cursor:pointer;
    background:var(--card); border:1px solid var(--border); color:var(--muted);
  }
  .tab.active{background:var(--accent); color:#0f1115; font-weight:700; border-color:var(--accent);}
  .results{margin-top:10px; max-height:260px; overflow-y:auto;}
  .result-item{
    padding:10px 12px; border-radius:8px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .result-item:hover,.result-item.active{background:#11131a;}
  .result-item .rname{font-size:14px; font-weight:600;}
  .result-item .rmeta{font-size:11px; color:var(--muted); margin-top:1px;}
  .result-item .rcal{font-size:13px; font-weight:700; color:var(--accent2); white-space:nowrap;}
  .empty-search{color:var(--muted); font-size:13px; text-align:center; padding:18px 0;}
  .divider{height:1px; background:var(--border); margin:14px 0;}
  .sel-name{font-size:15px; font-weight:700; margin-bottom:2px;}
  .sel-meta{font-size:12px; color:var(--muted); margin-bottom:2px;}
  .qty-row{display:flex; align-items:center; gap:10px; margin-top:12px;}
  .qty-row .ql{font-size:13px; color:var(--muted); white-space:nowrap; flex-shrink:0;}
  .qty-row input{width:80px; flex-shrink:0;}
  .qty-unit{font-size:13px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sel-total{
    background:#11131a; border-radius:8px; padding:10px 12px; margin-top:10px;
    display:flex; justify-content:space-between; font-size:13px;
  }
  .sel-total .tcal{font-weight:700; color:var(--accent2);}
  .sel-total .tmac{color:var(--muted);}
  .macro-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;}
  .macro-grid > div label{margin-top:0;}
  .tag{
    display:inline-block; background:#22262f; border-radius:4px;
    padding:1px 6px; font-size:10px; color:var(--muted); margin-left:6px; vertical-align:middle;
  }
  .meal-item{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 0; border-bottom:1px solid var(--border); gap:10px;
  }
  .meal-item:last-child{border-bottom:none;}
  .meal-item .name{font-size:14px; font-weight:600;}
  .meal-item .macros{font-size:11px; color:var(--muted); margin-top:2px;}
  .meal-item .cal{font-size:14px; font-weight:700; color:var(--accent2); white-space:nowrap;}
  .del{background:none; border:none; color:var(--danger); font-size:12px; width:auto; margin:0; padding:0 0 0 8px; cursor:pointer;}
  .common-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{
    background:#11131a; border:1px solid var(--border); border-radius:20px;
    padding:6px 12px; font-size:12px; cursor:pointer; color:var(--text);
  }
  .chip:active{background:#22262f;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .err{color:var(--danger); font-size:13px; margin-top:8px;}
</style>
</head>
<body>
<div class="app">
  <h1>🍽️ Calorie Tracker</h1>
  <div class="sub">Search 200+ foods or add manually — no account needed</div>

  <div class="card">
    <div class="totals">
      <div class="stat cal"><div class="v" id="totCal">0</div><div class="l">kcal today</div></div>
      <div class="stat"><div class="v" id="totP">0g</div><div class="l">protein</div></div>
      <div class="stat"><div class="v" id="totC">0g</div><div class="l">carbs</div></div>
      <div class="stat"><div class="v" id="totF">0g</div><div class="l">fat</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="t-search" onclick="switchTab('search')">🔍 Search Food</div>
    <div class="tab" id="t-manual" onclick="switchTab('manual')">✏️ Manual Entry</div>
  </div>

  <!-- Search panel -->
  <div id="panel-search" class="card">
    <input type="search" id="searchInput" placeholder="e.g. roti, dal, chicken, apple..." autocomplete="off">
    <div class="results" id="searchResults">
      <div class="empty-search">Type to search 200+ foods</div>
    </div>
    <div id="selPanel" style="display:none">
      <div class="divider"></div>
      <div class="sel-name" id="selName"></div>
      <div class="sel-meta" id="selMeta"></div>
      <div class="qty-row">
        <span class="ql">Qty</span>
        <input type="number" id="qtyInput" value="1" min="0.1" step="0.5">
        <span class="qty-unit" id="selUnit"></span>
      </div>
      <div class="sel-total">
        <span class="tcal" id="selTotalCal">0 kcal</span>
        <span class="tmac" id="selTotalMac">P 0g · C 0g · F 0g</span>
      </div>
      <button id="addBtn">Add to Log</button>
    </div>
  </div>

  <!-- Manual entry panel -->
  <div id="panel-manual" class="card" style="display:none">
    <label style="margin-top:0">Food name</label>
    <input type="text" id="manName" placeholder="e.g. Homemade khichdi, protein bar...">
    <div class="macro-grid">
      <div><label>Calories (kcal)</label><input type="number" id="manCal" placeholder="0" min="0"></div>
      <div><label>Protein (g)</label><input type="number" id="manP" placeholder="0" min="0"></div>
      <div><label>Carbs (g)</label><input type="number" id="manC" placeholder="0" min="0"></div>
      <div><label>Fat (g)</label><input type="number" id="manF" placeholder="0" min="0"></div>
    </div>
    <div id="manErr" class="err" style="display:none"></div>
    <button id="manAddBtn">Add to Log</button>
  </div>

  <div class="card">
    <label style="margin-top:0">Quick add — recent meals</label>
    <div id="commonList" class="common-list">
      <span class="empty" style="padding:4px 0; font-size:12px;">Meals you log will appear here</span>
    </div>
  </div>

  <div class="card">
    <label style="margin-top:0">Today's log</label>
    <div id="mealLog"><div class="empty">No meals logged yet today</div></div>
  </div>

  <button class="secondary" id="resetDayBtn">Start New Day</button>
</div>

// Storage: use window.storage if available (app platform), else localStorage
const storage = window.storage || {
  get: k => { const v = localStorage.getItem(k); return Promise.resolve(v !== null ? {value:v} : null); },
  set: (k, v) => { localStorage.setItem(k, v); return Promise.resolve(); }
};

let selectedFood = null;

function switchTab(tab) {
  document.getElementById('panel-search').style.display = tab === 'search' ? 'block' : 'none';
  document.getElementById('panel-manual').style.display = tab === 'manual' ? 'block' : 'none';
  document.getElementById('t-search').className = 'tab' + (tab === 'search' ? ' active' : '');
  document.getElementById('t-manual').className = 'tab' + (tab === 'manual' ? ' active' : '');
}

// Search
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    searchResults.innerHTML = '<div class="empty-search">Type to search 200+ foods</div>';
    return;
  }
  const matches = FOODS.filter(f => f.name.toLowerCase().includes(q)).slice(0, 8);
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="empty-search">No match — try Manual Entry</div>';
    return;
  }
  searchResults.innerHTML = '';
  matches.forEach(food => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `
      <div>
        <div class="rname">${esc(food.name)}<span class="tag">${food.cat}</span></div>
        <div class="rmeta">${esc(food.unit)}</div>
      </div>
      <div class="rcal">${food.cal} kcal</div>`;
    div.addEventListener('click', () => selectFood(food, div));
    searchResults.appendChild(div);
  });
});

function selectFood(food, el) {
  searchResults.querySelectorAll('.result-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  selectedFood = food;
  document.getElementById('selName').textContent = food.name;
  document.getElementById('selMeta').textContent = `Per ${food.unit}: ${food.cal} kcal · P ${food.p}g · C ${food.c}g · F ${food.f}g`;
  document.getElementById('selUnit').textContent = food.unit;
  document.getElementById('qtyInput').value = 1;
  updateSelTotal();
  const panel = document.getElementById('selPanel');
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('qtyInput').addEventListener('input', updateSelTotal);

function updateSelTotal() {
  if (!selectedFood) return;
  const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
  const cal = Math.round(selectedFood.cal * qty);
  const p = round1(selectedFood.p * qty);
  const c = round1(selectedFood.c * qty);
  const f = round1(selectedFood.f * qty);
  document.getElementById('selTotalCal').textContent = `${cal} kcal`;
  document.getElementById('selTotalMac').textContent = `P ${p}g · C ${c}g · F ${f}g`;
}

document.getElementById('addBtn').addEventListener('click', async () => {
  if (!selectedFood) return;
  const qty = parseFloat(document.getElementById('qtyInput').value) || 1;
  const qtyStr = qty === 1 ? selectedFood.unit : `${qty} × ${selectedFood.unit}`;
  const meal = {
    name: selectedFood.name,
    quantity: qtyStr,
    calories: Math.round(selectedFood.cal * qty),
    protein: round1(selectedFood.p * qty),
    carbs: round1(selectedFood.c * qty),
    fat: round1(selectedFood.f * qty),
    time: timeNow()
  };
  await logMeal(meal);
  // Reset search
  searchInput.value = '';
  searchResults.innerHTML = '<div class="empty-search">Type to search 200+ foods</div>';
  document.getElementById('selPanel').style.display = 'none';
  selectedFood = null;
});

// Manual entry
document.getElementById('manAddBtn').addEventListener('click', async () => {
  const name = document.getElementById('manName').value.trim();
  const cal = parseFloat(document.getElementById('manCal').value) || 0;
  const p = parseFloat(document.getElementById('manP').value) || 0;
  const c = parseFloat(document.getElementById('manC').value) || 0;
  const f = parseFloat(document.getElementById('manF').value) || 0;
  const errEl = document.getElementById('manErr');
  if (!name) { errEl.textContent = 'Please enter a food name.'; errEl.style.display = 'block'; return; }
  if (!cal) { errEl.textContent = 'Please enter calories.'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  await logMeal({name, quantity:'custom', calories:Math.round(cal), protein:p, carbs:c, fat:f, time:timeNow()});
  ['manName','manCal','manP','manC','manF'].forEach(id => document.getElementById(id).value = '');
});

async function logMeal(meal) {
  let meals = await loadDay();
  meals.push(meal);
  await saveDay(meals);
  await addToCommonMeals({...meal});
  renderLog();
}

// Storage helpers
function todayKey() { return 'meals:' + new Date().toISOString().slice(0,10); }
function timeNow() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function round1(n) { return Math.round(n * 10) / 10; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadDay() {
  try { const r = await storage.get(todayKey()); return r ? JSON.parse(r.value) : []; }
  catch(e) { return []; }
}
async function saveDay(meals) {
  try { await storage.set(todayKey(), JSON.stringify(meals)); } catch(e) {}
}
async function loadCommonMeals() {
  try { const r = await storage.get('commonMeals'); return r ? JSON.parse(r.value) : []; }
  catch(e) { return []; }
}
async function saveCommonMeals(list) {
  try { await storage.set('commonMeals', JSON.stringify(list)); } catch(e) {}
}
async function addToCommonMeals(meal) {
  let list = await loadCommonMeals();
  list = list.filter(m => !(m.name === meal.name && m.quantity === meal.quantity));
  list.unshift(meal);
  list = list.slice(0, 8);
  await saveCommonMeals(list);
  renderCommonMeals();
}

async function renderCommonMeals() {
  const list = await loadCommonMeals();
  const el = document.getElementById('commonList');
  if (list.length === 0) {
    el.innerHTML = '<span class="empty" style="padding:4px 0; font-size:12px;">Meals you log will appear here</span>';
    return;
  }
  el.innerHTML = '';
  list.forEach(meal => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = `${meal.name} — ${meal.calories} kcal`;
    chip.onclick = () => quickAddMeal(meal);
    el.appendChild(chip);
  });
}

async function quickAddMeal(meal) {
  let meals = await loadDay();
  meals.push({...meal, time: timeNow()});
  await saveDay(meals);
  renderLog();
}

async function renderLog() {
  const meals = await loadDay();
  const logEl = document.getElementById('mealLog');
  if (meals.length === 0) {
    logEl.innerHTML = '<div class="empty">No meals logged yet today</div>';
  } else {
    logEl.innerHTML = '';
    meals.forEach((m, idx) => {
      const item = document.createElement('div');
      item.className = 'meal-item';
      item.innerHTML = `
        <div>
          <div class="name">${esc(m.name)} <span style="color:var(--muted); font-weight:400;">· ${esc(m.quantity)}</span></div>
          <div class="macros">${m.time || ''} · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g</div>
        </div>
        <div style="display:flex; align-items:center;">
          <div class="cal">${m.calories} kcal</div>
          <button class="del" onclick="deleteMeal(${idx})">✕</button>
        </div>`;
      logEl.appendChild(item);
    });
  }
  const t = meals.reduce((a, m) => ({
    cal: a.cal + Number(m.calories||0),
    p: a.p + Number(m.protein||0),
    c: a.c + Number(m.carbs||0),
    f: a.f + Number(m.fat||0)
  }), {cal:0,p:0,c:0,f:0});
  document.getElementById('totCal').textContent = Math.round(t.cal);
  document.getElementById('totP').textContent = Math.round(t.p) + 'g';
  document.getElementById('totC').textContent = Math.round(t.c) + 'g';
  document.getElementById('totF').textContent = Math.round(t.f) + 'g';
}

window.deleteMeal = async function(idx) {
  let meals = await loadDay();
  meals.splice(idx, 1);
  await saveDay(meals);
  renderLog();
};

document.getElementById('resetDayBtn').addEventListener('click', async () => {
  if (confirm('Clear today\'s log? (common meals are kept)')) {
    await saveDay([]);
    renderLog();
  }
});

renderLog();
renderCommonMeals();
</script>
